name: Simulation application environment
description: Install the pinned Studio backend and recorded conveyor dataset
runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version-file: application/backend/.python-version
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: "0.12.17"
    - name: Install pinned dependencies
      shell: bash
      working-directory: application/backend
      run: |
        uv sync --frozen --extra tests --extra sim-e2e --extra cuda
        uv run --no-sync python -c 'from tests.integration.simulation_e2e import runtime_versions; print(runtime_versions())'
    - name: Fetch pinned recording
      shell: bash
      working-directory: application/backend
      run: |
        uv run --no-sync python - <<'PY'
        import json
        import os
        from pathlib import Path
        from huggingface_hub import snapshot_download
        from tests.integration.simulation_e2e import DATASET
        entry = DATASET
        # Keep the recording in the runner's persistent HF cache, outside checkout cleanup.
        root = Path(snapshot_download(entry['repo_id'], repo_type='dataset', revision=entry['revision'],
                                     allow_patterns=['simulation.json', 'meta/*', 'data/*', 'videos/*']))
        metadata = json.loads((root / 'meta/info.json').read_text())
        if metadata['total_episodes'] != entry['episodes']:
            raise ValueError('Recording episode count does not match selected dataset')
        with Path(os.environ['GITHUB_ENV']).open('a') as env:
            env.write(f'SIM_E2E_DATASET_DIR={root}\n')
        PY
