name: Epic
description: Track a larger initiative spanning multiple issues, components, or releases.
type: Epic
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What outcome are we trying to achieve?
      placeholder: Describe the outcome and why it matters.
    validations:
      required: true

  - type: textarea
    id: planning
    attributes:
      label: Planning details
      description: Add scope, success criteria, dependencies, risks, or links to child issues.
      value: |
        ## Scope and non-scope

        ## Success criteria

        ## Dependencies and risks
    validations:
      required: false
