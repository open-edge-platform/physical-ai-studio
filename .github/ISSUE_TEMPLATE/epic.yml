name: Epic
description: Track a larger initiative spanning multiple issues, components, or releases.
type: Epic
body:
  - type: textarea
    id: initiative
    attributes:
      label: What outcome are we trying to achieve?
      value: |
        ## Goal

        ## Scope and non-scope

        ## Success criteria
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and risks
      description: Link related issues and note important risks or open questions.
    validations:
      required: false
