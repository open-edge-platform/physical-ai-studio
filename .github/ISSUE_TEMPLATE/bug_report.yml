name: Bug report
description: Report an unexpected behavior in Physical AI Studio.
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        Please complete the sections that are relevant. You can leave optional sections blank.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Briefly describe what happened and what you expected.
      placeholder: Describe the unexpected behavior and expected result.
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Reproduction details
      description: Include steps, configuration, or other details that help reproduce the issue.
      value: |
        ## Steps to reproduce
        1.
        2.
        3.

        ## Additional context
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include only the details relevant to this issue.
      value: |
        - Studio version or commit:
        - OS:
        - Python:
        - Hardware accelerator:
        - Robot/camera:
        - Policy or dataset:
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs or traceback
      description: Remove secrets and personal information before posting logs.
      render: shell
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Links, screenshots, or other context
      description: Add any relevant links or attachments here.
    validations:
      required: false
