name: Documentation task
description: Report missing, incorrect, or unclear documentation.
type: Task
labels:
  - Documentation
body:
  - type: textarea
    id: summary
    attributes:
      label: What should be documented?
      description: Briefly describe the documentation problem.
      placeholder: Describe what is missing, incorrect, or unclear.
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Documentation details
      description: Add the location, suggested outcome, or relevant links.
      value: |
        ## Location

        ## Suggested outcome
    validations:
      required: false
