name: Library

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch: # run on request (no need for PR)

permissions: {} # No permissions by default on workflow level

env:
  UV_EXCLUDE_NEWER: "7 days"

concurrency:
  group: library-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-paths:
    name: Check if workflow should run
    runs-on: ubuntu-latest
    outputs:
      run_workflow: ${{ steps.check_paths.outputs.run }}
    permissions:
      contents: read
    steps:
      - &harden-runner
        name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: false
          disable-telemetry: true
          egress-policy: block
          allowed-endpoints: >
            azure.archive.ubuntu.com:80
            cas-server.xethub.hf.co:443
            dl.google.com:443
            download.pytorch.org:443
            download-r2.pytorch.org:443
            esm.ubuntu.com:443
            files.pythonhosted.org:443
            huggingface.co:443
            github.com:443
            index.crates.io:443
            packages.microsoft.com:443
            pypi.org:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            releases.astral.sh:443
            static.crates.io:443
            transfer.xethub.hf.co:443
            us.aws.cdn.hf.co:443
            proxy.golang.org:443
            storage.googleapis.com:443
            nodejs.org:443
            registry.npmjs.org:443
            utexas.box.com:443
            public.boxcloud.com:443
            dl.boxcloud.com:443

      - &checkout
        name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check paths
        id: check_paths
        uses: open-edge-platform/geti-ci/actions/check-paths@2ed3ce382d1dbd6db52c7c6b93ffdae280a1c06f # check-paths/v0.1.0
        with:
          files_yaml: |
            test:
              - library/**
              - .github/workflows/library.yml
              - '!**/*.md'
              - '!**/docs/**'

  code-quality:
    runs-on: ubuntu-latest
    needs: check-paths
    if: needs.check-paths.outputs.run_workflow == 'true'
    permissions:
      contents: read
    steps:
      - *harden-runner

      - *checkout

      - &set-up-python
        name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: "./library/.python-version"

      - &set-up-uv
        name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.17"

      # pyrefly-check hook uses `--no-sync`, so the dev group must already be synced.
      - name: Install dev tools
        working-directory: library
        run: uv sync --group dev

      - name: Run prek
        uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        with:
          extra-args: --all-files
          working-directory: library

  unit-tests:
    runs-on: ubuntu-latest
    needs: check-paths
    if: needs.check-paths.outputs.run_workflow == 'true'
    permissions:
      contents: read
    steps:
      - *harden-runner

      - *checkout

      - *set-up-python

      - name: Install system dependencies for headless rendering
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev

      - *set-up-uv

      - name: Verify lock file
        working-directory: library
        run: uv lock --check

      - name: Install dependencies
        working-directory: library
        run: |
          uv sync --frozen --extra tests --extra libero --extra policies --extra cpu --extra loggers

      - name: Run python unit tests
        working-directory: library
        env:
          # Headless rendering for MuJoCo/OpenGL (must be set before any imports)
          MUJOCO_GL: egl
          PYOPENGL_PLATFORM: egl
        run: |
          uv run --no-sync pytest tests/unit

  integration-tests:
    runs-on: [self-hosted, Linux, X64, gpu]
    needs: check-paths
    if: needs.check-paths.outputs.run_workflow == 'true'
    permissions:
      contents: read
    steps:
      - *harden-runner

      - *checkout

      - *set-up-python

      - name: Install system dependencies for headless rendering
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev cmake ffmpeg xvfb gcc

      - *set-up-uv

      - name: Verify lock file
        working-directory: library
        run: uv lock --check

      - name: Install dependencies
        working-directory: library
        run: |
          uv sync --frozen --extra tests --extra libero --extra policies --extra cu130

      - name: Run python integration tests
        working-directory: library
        env:
          # Headless rendering for MuJoCo/OpenGL (must be set before any imports)
          MUJOCO_GL: egl
          PYOPENGL_PLATFORM: egl
          # Force GLVND to dispatch EGL to the NVIDIA vendor driver. Mesa's EGL does
          # not support EGL_EXT_platform_device, which MuJoCo's EGL backend needs for
          # headless device rendering on the GPU runner.
          __EGL_VENDOR_LIBRARY_FILENAMES: /usr/share/glvnd/egl_vendor.d/10_nvidia.json
          # Avoid reusing potentially partial dataset downloads across self-hosted jobs.
          HF_LEROBOT_HOME: ${{ runner.temp }}/lerobot_test
        run: |
          uv run --no-sync pytest tests/integration -m "not slow"

  integration-tests-robocasa:
    runs-on: [self-hosted, Linux, X64, gpu]
    needs: check-paths
    if: needs.check-paths.outputs.run_workflow == 'true'
    permissions:
      contents: read
    steps:
      - *harden-runner

      - *checkout

      - *set-up-python

      - name: Install system dependencies for headless rendering
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev cmake ffmpeg xvfb gcc

      - *set-up-uv

      - name: Verify lock file
        working-directory: library
        run: uv lock --check

      - name: Create isolated RoboCasa environment
        working-directory: library
        run: |
          uv venv .venv-robocasa
          source .venv-robocasa/bin/activate
          uv sync --active --frozen --extra tests --extra pi05 --extra smolvla --extra cu130

      - name: Install RoboCasa and robosuite
        working-directory: library
        run: |
          source .venv-robocasa/bin/activate
          bash scripts/benchmark/install_robocasa.sh

      - name: Run RoboCasa unit gym tests
        working-directory: library
        run: |
          source .venv-robocasa/bin/activate
          python -m pytest tests/unit/gyms/test_robocasa.py

      - name: Download RoboCasa kitchen assets
        working-directory: library
        run: |
          source .venv-robocasa/bin/activate
          yes y | python -m robocasa.scripts.download_kitchen_assets \
            --type tex tex_generative fixtures_lw objs_lw objs_objaverse

      - name: Run RoboCasa integration test
        working-directory: library
        env:
          # Use EGL rendering (the primary GPU renderer)
          MUJOCO_GL: egl
          PYOPENGL_PLATFORM: egl
          # Force GLVND to dispatch EGL to the NVIDIA vendor driver
          __EGL_VENDOR_LIBRARY_FILENAMES: /usr/share/glvnd/egl_vendor.d/10_nvidia.json
          # Avoid reusing potentially partial dataset downloads across self-hosted jobs
          HF_LEROBOT_HOME: ${{ runner.temp }}/lerobot_test_robocasa
        run: |
          source .venv-robocasa/bin/activate
          python -m pytest tests/integration/gyms/test_robocasa_e2e.py

  required-check:
    name: Required Check library
    needs:
      - check-paths
      - code-quality
      - unit-tests
      - integration-tests
      - integration-tests-robocasa
    runs-on: ubuntu-latest
    env:
      CHECKS: ${{ join(needs.*.result, ' ') }}
    if: always() && !cancelled()
    steps:
      - *harden-runner

      - name: Check jobs results
        run: |
          for check in ${CHECKS}; do
            echo "::notice::check=${check}"
            if [[ "$check" != "success" && "$check" != "skipped" ]]; then
              echo "::error ::Required status checks failed. They must succeed before this pull request can be merged."
              exit 1
            fi
          done
