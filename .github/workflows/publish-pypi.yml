name: Publish PyPI

on:
  push:
    tags:
      - "lib/v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions: {}

jobs:
  validate:
    name: Validate lib tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate tag version matches pyproject.toml
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Extract version from tag: lib/v0.1.0 -> 0.1.0
          TAG_VERSION="${TAG#lib/v}"

          # Read version from library/pyproject.toml
          TOML_VERSION="$(grep '^version' library/pyproject.toml | head -1 | sed 's/.*= *"\(.*\)"/\1/')"

          echo "Tag version:    $TAG_VERSION"
          echo "pyproject.toml: $TOML_VERSION"

          if [[ "$TAG_VERSION" != "$TOML_VERSION" ]]; then
            echo "::error::Tag version '$TAG_VERSION' does not match pyproject.toml version '$TOML_VERSION'"
            exit 1
          fi
          echo "✓ Tag version matches pyproject.toml"

  build:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build distributions
        working-directory: library
        run: python -m pip install build==1.5.0 twine==6.2.0 && python -m build && python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: library/dist/

  smoke-test:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Verify clean wheel install
        run: |
          python -m venv .venv-smoke
          . .venv-smoke/bin/activate
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          python -m pip check
          python - <<'PY'
          import importlib.metadata as metadata

          import physicalai.data
          import physicalai.policies
          import physicalai.train

          print(metadata.version("physicalai-train"))
          PY

  publish:
    runs-on: ubuntu-latest
    needs: smoke-test
    if: startsWith(github.ref, 'refs/tags/lib/v')
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
