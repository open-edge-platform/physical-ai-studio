name: "Pull Request Labeler"
on:
  pull_request_target:
    types:
      - opened
      - synchronize
      # The labeler doesn't checkout/execute any contributed code, so it should be safe.
      - reopened # zizmor: ignore[dangerous-triggers]

permissions: {}

concurrency:
  group: labeler-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  label:
    permissions:
      contents: read # Read label configuration from repository
      pull-requests: write # Apply labels on pull requests
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          disable-sudo: true
          disable-telemetry: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443

      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
