name: Trainer Images

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    # check-paths always runs on push, so filter documentation-only pushes here
    paths-ignore:
      - "**/*.md"
      - "**/docs/**"
  workflow_dispatch:

permissions: {}

concurrency:
  group: trainer-images-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
  TRAINER_API_PROTOCOL_VERSION: "1"

jobs:
  check-paths:
    name: Check if workflow should run
    runs-on: ubuntu-latest
    outputs:
      run_workflow: ${{ steps.check_paths.outputs.run }}
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          disable-sudo: true
          disable-telemetry: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check paths
        id: check_paths
        uses: open-edge-platform/geti-ci/actions/check-paths@2ed3ce382d1dbd6db52c7c6b93ffdae280a1c06f # check-paths/v0.1.0
        with:
          files_yaml: |
            test:
              - application/backend/**
              - application/docker/Dockerfile.trainer
              - library/src/**
              - library/pyproject.toml
              - library/uv.lock
              - library/MANIFEST.in
              - library/.dockerignore
              - .github/workflows/trainer-images.yml
              - .github/actions/trainer-image-build/**
              - '!**/*.md'
              - '!**/docs/**'

  build-and-smoke-test:
    name: Build and smoke-test (${{ matrix.device }})
    needs: check-paths
    if: github.ref != 'refs/heads/main' && needs.check-paths.outputs.run_workflow == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        device: [cuda, xpu]
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          disable-sudo: false
          disable-telemetry: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            auth.docker.io:443
            deb.debian.org:80
            developer.download.nvidia.com:443
            download.pytorch.org:443
            download-r2.pytorch.org:443
            files.pythonhosted.org:443
            ghcr.io:443
            ghcr1production.blob.core.windows.net:443
            github.com:443
            gitlab.com:443
            keyserver.ubuntu.com:443
            pkg-containers.githubusercontent.com:443
            ppa.launchpadcontent.net:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            pypi.org:443
            registry-1.docker.io:443

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and smoke-test trainer image
        uses: $/.github/actions/trainer-image-build
        with:
          device: ${{ matrix.device }}
          push: false
          registry: ${{ env.IMAGE_REGISTRY }}
          protocol-version: ${{ env.TRAINER_API_PROTOCOL_VERSION }}
          enable-compile-model: ${{ vars.PUBLIC_ENABLE_COMPILE_MODEL || 'true' }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}

  build-and-smoke-test-main:
    name: Build and smoke-test main (${{ matrix.device }})
    needs: check-paths
    if: github.ref == 'refs/heads/main' && needs.check-paths.outputs.run_workflow == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        device: [cuda, xpu]
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          disable-sudo: false
          disable-telemetry: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            auth.docker.io:443
            deb.debian.org:80
            developer.download.nvidia.com:443
            download.pytorch.org:443
            download-r2.pytorch.org:443
            files.pythonhosted.org:443
            ghcr.io:443
            ghcr1production.blob.core.windows.net:443
            github.com:443
            gitlab.com:443
            keyserver.ubuntu.com:443
            pkg-containers.githubusercontent.com:443
            ppa.launchpadcontent.net:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            pypi.org:443
            registry-1.docker.io:443

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and smoke-test trainer image
        uses: $/.github/actions/trainer-image-build
        with:
          device: ${{ matrix.device }}
          push: true
          registry: ${{ env.IMAGE_REGISTRY }}
          protocol-version: ${{ env.TRAINER_API_PROTOCOL_VERSION }}
          enable-compile-model: ${{ vars.PUBLIC_ENABLE_COMPILE_MODEL || 'true' }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish, attest, scan, and sign (${{ matrix.device }})
    needs: [check-paths, build-and-smoke-test-main]
    if: github.ref == 'refs/heads/main' && needs.check-paths.outputs.run_workflow == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        device: [cuda, xpu]
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          disable-sudo: false
          disable-telemetry: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            auth.docker.io:443
            deb.debian.org:80
            developer.download.nvidia.com:443
            download.pytorch.org:443
            download-r2.pytorch.org:443
            files.pythonhosted.org:443
            fulcio.sigstore.dev:443
            ghcr.io:443
            gitlab.com:443
            ghcr1production.blob.core.windows.net:443
            github.com:443
            keyserver.ubuntu.com:443
            mirror.gcr.io:443
            pkg-containers.githubusercontent.com:443
            ppa.launchpadcontent.net:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            pypi.org:443
            raw.githubusercontent.com:443
            registry-1.docker.io:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            timestamp.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set build metadata
        id: build-metadata
        run: |
          echo "version=$(grep -m1 '^version = ' application/backend/pyproject.toml | sed -E 's/version = \"(.*)\"/\1/')" >> "$GITHUB_OUTPUT"
          echo "short-sha=$(echo "$GITHUB_SHA" | head -c 8)" >> "$GITHUB_OUTPUT"
          echo "library-version=$(grep -m1 '^version = ' library/pyproject.toml | sed -E 's/version = "(.*)"/\1/')" >> "$GITHUB_OUTPUT"

      - name: Download smoke-tested digest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: trainer-image-digest-${{ matrix.device }}
          path: ${{ runner.temp }}/trainer-image

      - name: Read smoke-tested digest
        id: image
        env:
          DIGEST_FILE: ${{ runner.temp }}/trainer-image/image-digest.txt
        run: |
          digest="$(cat "$DIGEST_FILE")"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Invalid smoke-tested image digest"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Copy the tested index, including its SBOM and provenance, without rebuilding.
      - name: Publish smoke-tested image
        env:
          IMAGE: ${{ env.IMAGE_REGISTRY }}/physicalai-trainer-${{ matrix.device }}@${{ steps.image.outputs.digest }}
          IMMUTABLE_TAG: ${{ env.IMAGE_REGISTRY }}/physicalai-trainer-${{ matrix.device }}:${{ steps.build-metadata.outputs.version }}-dev-${{ steps.build-metadata.outputs.short-sha }}
          BRANCH_TAG: ${{ env.IMAGE_REGISTRY }}/physicalai-trainer-${{ matrix.device }}:${{ github.ref_name }}
        run: docker buildx imagetools create --tag "$IMMUTABLE_TAG" --tag "$BRANCH_TAG" "$IMAGE"

      - name: Verify required image metadata and attestations
        env:
          IMAGE: ${{ env.IMAGE_REGISTRY }}/physicalai-trainer-${{ matrix.device }}@${{ steps.image.outputs.digest }}
          VERSION: ${{ steps.build-metadata.outputs.version }}
          LIBRARY_VERSION: ${{ steps.build-metadata.outputs.library-version }}
        run: |
          docker buildx imagetools inspect "$IMAGE" --format '{{json .Image}}' > image.json
          docker buildx imagetools inspect "$IMAGE" --format '{{json .Provenance}}' > provenance.json
          docker buildx imagetools inspect "$IMAGE" --format '{{json .SBOM}}' > sbom.json
          python - <<'PY'
          import json, os

          def load(path):
              with open(path) as handle:
                  return json.load(handle)

          # `imagetools inspect` returns the image config directly for a single
          # platform and a {"os/arch": config} mapping for a multi-platform index.
          image = load("image.json")
          configs = [image] if "config" in image else list(image.values())
          assert configs, "no image config returned by imagetools inspect"

          expected = {
              "org.opencontainers.image.revision": os.environ["GITHUB_SHA"],
              "org.opencontainers.image.version": os.environ["VERSION"],
              "org.open-edge-platform.physicalai.trainer.api-protocol": os.environ[
                  "TRAINER_API_PROTOCOL_VERSION"
              ],
              "org.open-edge-platform.physicalai.trainer.library-version": os.environ["LIBRARY_VERSION"],
          }
          for config in configs:
              labels = config.get("config", {}).get("Labels") or {}
              for label, value in expected.items():
                  assert labels.get(label) == value, (
                      f"label {label}: expected {value!r}, got {labels.get(label)!r}"
                  )

          for name, path in (("provenance", "provenance.json"), ("SBOM", "sbom.json")):
              attestation = load(path)
              assert attestation, f"{name} attestation is missing"
          PY

      - name: Sign immutable trainer image
        uses: open-edge-platform/geti-ci/actions/sign-image@3690cbcc173cf90e0e0999b4822c3f8ebab9c137 # sign-image/v0.1.2
        with:
          image-uri: ${{ env.IMAGE_REGISTRY }}/physicalai-trainer-${{ matrix.device }}:${{ steps.build-metadata.outputs.version }}-dev-${{ steps.build-metadata.outputs.short-sha }}

      # `protocol-<N>` is promoted only after the immutable digest is verified
      # and signed, so a failure in either step leaves it pointing at the
      # previous good build instead of an unsigned one. It's the tag Studio
      # resolves automatically for SSH-provisioned training, and there is no
      # `latest` fallback behind it, so it must never advance ahead of
      # signing.
      - name: Promote protocol tag after signing
        env:
          IMAGE: ${{ env.IMAGE_REGISTRY }}/physicalai-trainer-${{ matrix.device }}@${{ steps.image.outputs.digest }}
          PROTOCOL_TAG: ${{ env.IMAGE_REGISTRY }}/physicalai-trainer-${{ matrix.device }}:protocol-${{ env.TRAINER_API_PROTOCOL_VERSION }}
        run: |
          docker buildx imagetools create --tag "$PROTOCOL_TAG" "$IMAGE"

  required-check:
    name: Required Check trainer-images
    needs:
      [check-paths, build-and-smoke-test, build-and-smoke-test-main, publish]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Check jobs results
        env:
          BUILD_RESULT: ${{ needs.build-and-smoke-test.result }}
          MAIN_BUILD_RESULT: ${{ needs.build-and-smoke-test-main.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          REF: ${{ github.ref }}
        run: |
          test "$BUILD_RESULT" = success -o "$BUILD_RESULT" = skipped
          test "$MAIN_BUILD_RESULT" = success -o "$MAIN_BUILD_RESULT" = skipped
          if [ "$REF" = refs/heads/main ]; then
            test "$PUBLISH_RESULT" = success -o "$PUBLISH_RESULT" = skipped
          fi
