name: Trainer Images

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    # check-paths always runs on push, so filter documentation-only pushes here
    paths-ignore:
      - "**/*.md"
      - "**/docs/**"
  workflow_dispatch:

permissions: {}

concurrency:
  group: trainer-images-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
  TRAINER_API_PROTOCOL_VERSION: "1"

jobs:
  check-paths:
    name: Check if workflow should run
    runs-on: ubuntu-latest
    outputs:
      run_workflow: ${{ steps.check_paths.outputs.run }}
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          disable-sudo: true
          disable-telemetry: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check paths
        id: check_paths
        uses: open-edge-platform/geti-ci/actions/check-paths@2ed3ce382d1dbd6db52c7c6b93ffdae280a1c06f # check-paths/v0.1.0
        with:
          files_yaml: |
            test:
              - application/backend/**
              - application/docker/Dockerfile.trainer
              - application/plugin/**
              - library/src/**
              - library/pyproject.toml
              - library/uv.lock
              - library/MANIFEST.in
              - library/.dockerignore
              - .github/workflows/trainer-images.yml
              - '!**/*.md'
              - '!**/docs/**'

  build-and-smoke-test:
    name: Build and smoke-test (${{ matrix.device }})
    needs: check-paths
    if: needs.check-paths.outputs.run_workflow == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        device: [cuda, xpu]
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          disable-sudo: false
          disable-telemetry: true
          egress-policy: block
          allowed-endpoints: >
            auth.docker.io:443
            deb.debian.org:80
            developer.download.nvidia.com:443
            download.pytorch.org:443
            download-r2.pytorch.org:443
            files.pythonhosted.org:443
            ghcr.io:443
            ghcr1production.blob.core.windows.net:443
            github.com:443
            keyserver.ubuntu.com:443
            pkg-containers.githubusercontent.com:443
            ppa.launchpadcontent.net:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            pypi.org:443
            registry-1.docker.io:443

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set build metadata
        id: build-metadata
        run: |
          echo "version=$(tr -d '[:space:]' < application/VERSION)" >> "$GITHUB_OUTPUT"
          echo "created=$(date --utc --iso-8601=seconds)" >> "$GITHUB_OUTPUT"
          echo "library-version=$(grep -m1 '^version = ' library/pyproject.toml | sed -E 's/version = "(.*)"/\1/')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build trainer image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: application/docker/Dockerfile.trainer
          build-contexts: |
            libs=library
            plugin=application/plugin
          target: physicalai-trainer-${{ matrix.device }}
          platforms: linux/amd64
          load: true
          push: false
          tags: physicalai-trainer-${{ matrix.device }}:test
          # PR builds are cache-read-only; the per-device build cache is written
          # from `main` by the publish job below.
          cache-from: type=registry,ref=${{ env.IMAGE_REGISTRY }}/physicalai-trainer-${{ matrix.device }}:buildcache
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.build-metadata.outputs.created }}
            APPLICATION_VERSION=${{ steps.build-metadata.outputs.version }}
            TRAINER_API_PROTOCOL_VERSION=${{ env.TRAINER_API_PROTOCOL_VERSION }}
            PHYSICALAI_TRAIN_VERSION=${{ steps.build-metadata.outputs.library-version }}

      - name: Smoke-test trainer image
        env:
          IMAGE: physicalai-trainer-${{ matrix.device }}:test
          DEVICE: ${{ matrix.device }}
          VERSION: ${{ steps.build-metadata.outputs.version }}
          BUILD_DATE: ${{ steps.build-metadata.outputs.created }}
          LIBRARY_VERSION: ${{ steps.build-metadata.outputs.library-version }}
        run: |
          container_name="physicalai-trainer-${DEVICE}-smoke"
          cleanup() { docker rm -f "$container_name" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          test "$(docker image inspect "$IMAGE" --format '{{.Config.User}}')" = "trainer"
          test "$(docker image inspect "$IMAGE" --format '{{json .Config.Entrypoint}}')" = '["physicalai-trainer"]'
          test "$(docker image inspect "$IMAGE" --format '{{index .Config.Labels "org.open-edge-platform.physicalai.trainer.api-protocol"}}')" = "1"
          # `services.ssh.docker_ops.resolve_protocol_image` reads this label
          # pre-pull, before `/health` is ever reachable: it must carry the
          # real installed version, not the Dockerfile's `unknown` default.
          test "$(docker image inspect "$IMAGE" --format '{{index .Config.Labels "org.open-edge-platform.physicalai.trainer.library-version"}}')" = "$LIBRARY_VERSION"
          ! docker run --rm --entrypoint sh "$IMAGE" -c 'test -e /app/application/backend -o -e /app/application/ui -o -e /var/run/docker.sock'

          docker run -d --name "$container_name" -p 127.0.0.1::8001 "$IMAGE"
          host_port="$(docker port "$container_name" 8001/tcp | sed 's/.*://')"
          for _ in $(seq 1 30); do
            if curl --fail --silent "http://127.0.0.1:${host_port}/health" > health.json; then
              break
            fi
            sleep 2
          done
          test -s health.json

          # Read the installed library version from the image itself so this
          # check never drifts from what /health actually reports.
          reported_version="$(docker run --rm --entrypoint python "$IMAGE" -c 'from importlib.metadata import version; print(version("physicalai-train"))')"
          test "$reported_version" = "$LIBRARY_VERSION"
          LIBRARY_VERSION="$reported_version" python -c 'import json, os; health = json.load(open("health.json")); assert health == {"status": "healthy", "protocol_version": 1, "device_type": os.environ["DEVICE"], "build_revision": os.environ["GITHUB_SHA"], "build_date": os.environ["BUILD_DATE"], "application_version": os.environ["VERSION"], "library_version": os.environ["LIBRARY_VERSION"]}'

  publish:
    name: Publish, attest, scan, and sign (${{ matrix.device }})
    needs: [check-paths, build-and-smoke-test]
    if: github.ref == 'refs/heads/main' && needs.check-paths.outputs.run_workflow == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        device: [cuda, xpu]
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          disable-sudo: false
          disable-telemetry: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            auth.docker.io:443
            deb.debian.org:80
            developer.download.nvidia.com:443
            download.pytorch.org:443
            download-r2.pytorch.org:443
            files.pythonhosted.org:443
            fulcio.sigstore.dev:443
            ghcr.io:443
            ghcr1production.blob.core.windows.net:443
            github.com:443
            keyserver.ubuntu.com:443
            mirror.gcr.io:443
            pkg-containers.githubusercontent.com:443
            ppa.launchpadcontent.net:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            pypi.org:443
            raw.githubusercontent.com:443
            registry-1.docker.io:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            timestamp.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set build metadata
        id: build-metadata
        run: |
          echo "version=$(tr -d '[:space:]' < application/VERSION)" >> "$GITHUB_OUTPUT"
          echo "short-sha=$(echo "$GITHUB_SHA" | head -c 8)" >> "$GITHUB_OUTPUT"
          echo "created=$(date --utc --iso-8601=seconds)" >> "$GITHUB_OUTPUT"
          echo "library-version=$(grep -m1 '^version = ' library/pyproject.toml | sed -E 's/version = "(.*)"/\1/')" >> "$GITHUB_OUTPUT"

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and publish immutable image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: application/docker/Dockerfile.trainer
          build-contexts: |
            libs=library
            plugin=application/plugin
          target: physicalai-trainer-${{ matrix.device }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_REGISTRY }}/physicalai-trainer-${{ matrix.device }}:${{ steps.build-metadata.outputs.version }}-dev-${{ steps.build-metadata.outputs.short-sha }}
            ${{ env.IMAGE_REGISTRY }}/physicalai-trainer-${{ matrix.device }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.build-metadata.outputs.version }}
            org.opencontainers.image.created=${{ steps.build-metadata.outputs.created }}
            org.open-edge-platform.physicalai.trainer.api-protocol=${{ env.TRAINER_API_PROTOCOL_VERSION }}
          sbom: true
          provenance: mode=max
          # `main` publishes warm the per-device build cache that PR builds read.
          cache-from: type=registry,ref=${{ env.IMAGE_REGISTRY }}/physicalai-trainer-${{ matrix.device }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_REGISTRY }}/physicalai-trainer-${{ matrix.device }}:buildcache,mode=max,compression=zstd,image-manifest=true,ignore-error=true
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.build-metadata.outputs.created }}
            APPLICATION_VERSION=${{ steps.build-metadata.outputs.version }}
            TRAINER_API_PROTOCOL_VERSION=${{ env.TRAINER_API_PROTOCOL_VERSION }}
            PHYSICALAI_TRAIN_VERSION=${{ steps.build-metadata.outputs.library-version }}

      - name: Verify required image metadata and attestations
        env:
          IMAGE: ${{ env.IMAGE_REGISTRY }}/physicalai-trainer-${{ matrix.device }}@${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.build-metadata.outputs.version }}
          LIBRARY_VERSION: ${{ steps.build-metadata.outputs.library-version }}
        run: |
          docker buildx imagetools inspect "$IMAGE" --format '{{json .Image}}' > image.json
          docker buildx imagetools inspect "$IMAGE" --format '{{json .Provenance}}' > provenance.json
          docker buildx imagetools inspect "$IMAGE" --format '{{json .SBOM}}' > sbom.json
          python - <<'PY'
          import json, os

          def load(path):
              with open(path) as handle:
                  return json.load(handle)

          # `imagetools inspect` returns the image config directly for a single
          # platform and a {"os/arch": config} mapping for a multi-platform index.
          image = load("image.json")
          configs = [image] if "config" in image else list(image.values())
          assert configs, "no image config returned by imagetools inspect"

          expected = {
              "org.opencontainers.image.revision": os.environ["GITHUB_SHA"],
              "org.opencontainers.image.version": os.environ["VERSION"],
              "org.open-edge-platform.physicalai.trainer.api-protocol": os.environ[
                  "TRAINER_API_PROTOCOL_VERSION"
              ],
              "org.open-edge-platform.physicalai.trainer.library-version": os.environ["LIBRARY_VERSION"],
          }
          for config in configs:
              labels = config.get("config", {}).get("Labels") or {}
              for label, value in expected.items():
                  assert labels.get(label) == value, (
                      f"label {label}: expected {value!r}, got {labels.get(label)!r}"
                  )

          for name, path in (("provenance", "provenance.json"), ("SBOM", "sbom.json")):
              attestation = load(path)
              assert attestation, f"{name} attestation is missing"
          PY

      - name: Sign immutable trainer image
        uses: open-edge-platform/geti-ci/actions/sign-image@7e686c1248b3939f8ee8e04e2612da727e379d91
        with:
          image-uri: ${{ env.IMAGE_REGISTRY }}/physicalai-trainer-${{ matrix.device }}:${{ steps.build-metadata.outputs.version }}-dev-${{ steps.build-metadata.outputs.short-sha }}

      # `protocol-<N>` is promoted only after the immutable digest is verified
      # and signed, so a failure in either step leaves it pointing at the
      # previous good build instead of an unsigned one. It's the tag Studio
      # resolves automatically for SSH-provisioned training, and there is no
      # `latest` fallback behind it, so it must never advance ahead of
      # signing.
      - name: Promote protocol tag after signing
        env:
          IMAGE: ${{ env.IMAGE_REGISTRY }}/physicalai-trainer-${{ matrix.device }}@${{ steps.build.outputs.digest }}
          PROTOCOL_TAG: ${{ env.IMAGE_REGISTRY }}/physicalai-trainer-${{ matrix.device }}:protocol-${{ env.TRAINER_API_PROTOCOL_VERSION }}
        run: |
          docker buildx imagetools create --tag "$PROTOCOL_TAG" "$IMAGE"

  required-check:
    name: Required Check trainer-images
    needs: [check-paths, build-and-smoke-test, publish]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Check jobs results
        env:
          BUILD_RESULT: ${{ needs.build-and-smoke-test.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          REF: ${{ github.ref }}
        run: |
          test "$BUILD_RESULT" = success -o "$BUILD_RESULT" = skipped
          if [ "$REF" = refs/heads/main ]; then
            test "$PUBLISH_RESULT" = success -o "$PUBLISH_RESULT" = skipped
          fi
