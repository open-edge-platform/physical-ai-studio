name: PR Title

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - edited

permissions: {} # No permissions by default on workflow level

jobs:
  validate:
    name: Validate PR title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          disable-sudo: true
          disable-telemetry: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443

      - name: Check PR title
        uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            test
            chore
            ci
            perf
            revert
          requireScope: false
          subjectPattern: ^.+$
          subjectPatternError: |
            The subject (after "type: ") cannot be empty.
          # Don't validate PR body or commits, only the title
          validateSingleCommit: false
          ignoreLabels: |
            skip-conventional-commits
