name: TruffleHog Secret Scan

permissions: {} # No permissions by default on workflow level

on:
  workflow_dispatch:
  push:
  pull_request:

concurrency:
  group: backend-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          disable-sudo: true
          disable-telemetry: true
          egress-policy: block
          allowed-endpoints: >
            api.sonarcloud.io:443
            app.eraser.io:443
            ghcr.io:443
            github.com:443
            pkg-containers.githubusercontent.com:443
            sonarcloud.io:443
            api.github.com:443
            auth.docker.io:443
            registry.npmjs.org:443
            upload.pypi.org:443
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Secret Scanning
        uses: trufflesecurity/trufflehog@b2b0a92070f206ab7b5a1105d82a7f2f48d92341 # v3.99.0
        with:
          # New branches have no previous commit; scan changes since the default branch, not its entire history.
          base: ${{ github.event_name == 'push' && github.event.before == '0000000000000000000000000000000000000000' && format('refs/remotes/origin/{0}', github.event.repository.default_branch) || '' }}
          head: ${{ github.event_name == 'push' && github.event.before == '0000000000000000000000000000000000000000' && github.sha || '' }}
          extra_args: --results=verified,unknown --exclude-paths=.trufflehogignore
