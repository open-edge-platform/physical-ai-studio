name: Publish Application TestPyPI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          disable-sudo: false
          disable-telemetry: true
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          cache: false
          enable-cache: false
          version: "0.12.17"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version-file: application/ui/.nvmrc

      - name: Ensure npm supports min-release-age
        run: npm i -g npm@11.14.0 # zizmor: ignore[adhoc-packages]

      - name: Set dev version for TestPyPI
        run: |
          APP_VERSION="$(grep -m1 '^version = ' application/backend/pyproject.toml | sed -E 's/version = "(.*)"/\1/')"
          DEV_VERSION="${APP_VERSION}.dev$(date -u +%Y%m%d%H%M%S)"
          echo "VERSION_OVERRIDE=${DEV_VERSION}" >> "$GITHUB_ENV"
          echo "Building version: ${DEV_VERSION}"

      - name: Build application package
        run: bash application/backend/scripts/build_package.sh

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: physicalai-studio-distributions
          path: application/backend/dist/

  smoke-test:
    name: Smoke test
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          disable-sudo: false
          disable-telemetry: true
          egress-policy: audit

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          cache: false
          enable-cache: false

      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: physicalai-studio-distributions
          path: dist/

      - name: Verify clean wheel install
        env:
          VIRTUAL_ENV: .venv-smoke
        run: |
          uv venv .venv-smoke
          uv pip install dist/*.whl
          uv run python - <<'PY'
          import importlib.metadata as metadata
          import cli
          print(metadata.version("physicalai-studio"))
          PY

  publish:
    name: Publish to TestPyPI
    runs-on: ubuntu-latest
    needs: smoke-test
    permissions:
      id-token: write # OIDC trusted publishing
    environment:
      name: testpypi
      url: https://test.pypi.org/p/physicalai-studio
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: physicalai-studio-distributions
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
