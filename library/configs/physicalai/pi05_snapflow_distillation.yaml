# Pi05 SnapFlow Phase-2 Distillation Configuration
#
# Use this config for the second phase of SnapFlow two-phase training when you
# want two explicit runs — for example to distill from a checkpoint you
# already have (a published checkpoint, or a phase-1 run from elsewhere).
#
# Two-phase recipe (two explicit CLI runs):
#
#   # Phase 1 — standard flow-matching training
#   physicalai fit --config configs/physicalai/pi05.yaml
#
#   # Phase 2 — SnapFlow distillation, VLM frozen
#   physicalai fit \
#       --config configs/physicalai/pi05_snapflow_distillation.yaml \
#       --fit.ckpt_path ./experiments/lightning_logs/version_0/checkpoints/last.ckpt \
#       --trainer.max_steps 30000
#
# Note that `--fit.ckpt_path` is a full Lightning *resume*: it restores the
# global step, optimizer state, and LR schedule from phase 1. Set
# `--trainer.max_steps` to the combined phase-1 + phase-2 budget accordingly.
# This does NOT give phase 2 its own optimizer state or LR horizon — if you
# need that, warm-start from phase-1 weights only via the Python API instead
# (see `Policy.load_from_checkpoint` in docs/how-to/training/snapflow_distillation.md).
#
# Single-run alternative (recommended):
#   configs/physicalai/pi05_finetune_and_snapflow_distillation.yaml uses
#   SnapFlowPhaseCallback to run both phases in one `physicalai fit`, with no
#   checkpoint handoff.
#
# See docs/how-to/training/snapflow_distillation.md.
# Paper reference: arXiv:2604.05656 (SnapFlow)

model:
  class_path: physicalai.policies.Pi05
  init_args:
    # Model architecture
    paligemma_variant: gemma_2b
    action_expert_variant: gemma_300m
    dtype: bfloat16

    # Input / output structure
    n_obs_steps: 1
    chunk_size: 50
    n_action_steps: 50
    max_state_dim: 32
    max_action_dim: 32

    # Image preprocessing
    image_resolution:
      - 224
      - 224

    # SnapFlow distillation — paper defaults (§3.6 + Appendix J)
    snapflow_enabled: true
    snapflow_alpha: 0.5 # FM-loss weight
    snapflow_lambda: 0.1 # shortcut-loss scale
    snapflow_num_inference_steps: 1 # 1-NFE inference

    # Freeze VLM; train only action expert + target-time embedding (~10% params)
    train_expert_only: true
    freeze_vision_encoder: false # train_expert_only already covers the VLM

    # Optimizer
    optimizer_lr: 2.5e-5
    optimizer_weight_decay: 0.01
    optimizer_grad_clip_norm: 1.0

    # Scheduler
    scheduler_warmup_steps: 1000
    scheduler_decay_steps: 30000
    scheduler_decay_lr: 2.5e-6

data:
  class_path: physicalai.data.lerobot.LeRobotDataModule
  init_args:
    repo_id: "lerobot/aloha_sim_transfer_cube_human"
    train_batch_size: 8
    data_format: "physicalai"

trainer:
  max_steps: 30000
  accelerator: gpu
  devices: 1
  precision: 32
  log_every_n_steps: 100
  check_val_every_n_epoch: 10
