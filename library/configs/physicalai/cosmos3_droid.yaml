# =============================================================================
# NVIDIA Cosmos 3 Policy Training Configuration - DROID
# Post-training with rectified flow matching (PEFT LoRA default)
# =============================================================================
#
# Default configuration fine-tunes Cosmos3-Edge with LoRA rank 32 on attention
# and a freshly initialized domain action head for DROID (joint_pos action space:
# 7 arm joint positions + 1 gripper position = 8D).
#
# Uses split-column combining to concatenate joint positions and gripper position
# from raw DROID datasets (e.g. nvidia/Cosmos3-DROID or lerobot/droid_100),
# discarding unused sub-columns (velocities, torques, cartesian poses).
#
# Supported accelerators: CUDA (gpu), Intel XPU (xpu), CPU.
#
# Usage:
#   physicalai fit --config configs/physicalai/cosmos3_droid.yaml
#
# Intel XPU example:
#   physicalai fit --config configs/physicalai/cosmos3_droid.yaml \
#       --trainer.accelerator xpu
#
# Full fine-tuning example:
#   physicalai fit --config configs/physicalai/cosmos3_droid.yaml \
#       --model.mode full \
#       --model.head_lr_mult 10.0
# =============================================================================

model:
  class_path: physicalai.policies.Cosmos3
  init_args:
    pretrained_model_name_or_path: "nvidia/Cosmos3-Edge"
    mode: "peft"
    paradigm: "policy"
    rank: 32
    alpha_scale: 1.0
    dora: false
    head_lr_mult: 2.0
    action_weight: 10.0
    chunk_size: 32
    n_action_steps: 32
    resolution_tier: 256
    fps: 15
    grad_checkpoint: true
    embodiment: "droid_lerobot"
    prompt: ""
    dtype: "bfloat16"
    optimizer_lr: 1.0e-4
    optimizer_grad_clip_norm: 1.0

data:
  class_path: physicalai.data.lerobot.LeRobotDataModule
  init_args:
    repo_id: "nvidia/Cosmos3-DROID"
    root: "/home/ugenc/.cache/huggingface/hub/datasets--nvidia--Cosmos3-DROID/snapshots/5c11a20accb11497270a5247a7f1e66ad04c956c/success"
    train_batch_size: 1
    # Restrict to 1 episode for fast iterations during development
    episodes:
      - 0
    # Concatenate arm joints (7D) and gripper (1D) into canonical 8D state and action tensors
    state_columns:
      - "observation.state.joint_positions"
      - "observation.state.gripper_position"
    action_columns:
      - "action.joint_position"
      - "action.gripper_position"
    data_format: "physicalai"
    video_backend: "pyav"

trainer:
  max_epochs: 10
  accumulate_grad_batches: 8
  gradient_clip_val: 1.0
  accelerator: xpu
  strategy: xpu_single
  devices: 1
  precision: bf16-mixed
