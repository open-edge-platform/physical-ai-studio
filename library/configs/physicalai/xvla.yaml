# XVLA Policy Training Configuration
#
# XVLA pairs a Florence-2 encoder with a soft-prompted, domain-aware transformer that
# denoises a whole action chunk by flow matching. One checkpoint serves many embodiments:
# `domain_id` selects the per-domain projections and soft prompts, and `action_mode` maps
# the model's fixed-width action vector onto the robot at hand.
#
# Usage:
#   physicalai fit --config configs/physicalai/xvla.yaml
#
# Requirements:
#   - pip install 'physicalai-train[xvla]'
#   - The Florence-2 backbone and the BART tokenizer are pulled from the HuggingFace Hub
#     on first use.
#   - Export is not supported for this family; deploy through the policy API.

model:
  class_path: physicalai.policies.XVLA
  init_args:
    # Start from a released checkpoint (architecture and action space come with it):
    # pretrained_name_or_path: lerobot/xvla_libero

    dtype: float32

    # Input / output structure. The whole chunk is executed before the next is predicted.
    n_obs_steps: 1
    chunk_size: 32
    n_action_steps: 32

    # Action transformer. These are the published XVLA dimensions; shrink `depth` and
    # `hidden_size` to fit a smaller GPU.
    hidden_size: 1024
    depth: 24
    num_heads: 16
    num_domains: 30
    len_soft_prompts: 32
    # Raise `max_len_seq` if the sequence overflows: it holds `chunk_size` action tokens,
    # the primary view's image tokens, `tokenizer_max_length` prompt tokens and the pooled
    # auxiliary views.
    max_len_seq: 512

    # Action space. "auto" keeps the pretrained 20-channel width but supervises and emits
    # exactly the dataset's action width, so it fits any embodiment. The released
    # checkpoints were trained with "ee6d" (bimanual end-effector pose + gripper logits).
    action_mode: auto
    max_action_dim: 20
    num_denoising_steps: 10

    # Proprioception is zero-padded to a fixed width.
    use_proprio: true
    max_state_dim: 32

    # Which domain's projections and soft prompts to use. Set `domain_feature_key` instead
    # to read a per-sample index out of the batch when training on mixed embodiments.
    domain_id: 0

    # Cameras. Leave `num_image_views` unset to take the count from the dataset; add
    # `empty_cameras` to line a dataset up with a checkpoint trained on more views.
    # resize_imgs_with_padding: [224, 224]
    empty_cameras: 0

    # Finetuning. The Florence-2 encoders train at `optimizer_vlm_lr_scale` of the base
    # learning rate; freeze them outright on a small dataset.
    freeze_vision_encoder: false
    freeze_language_encoder: false
    train_policy_transformer: true
    train_soft_prompts: true

    # XVLA's action spaces carry their own per-channel loss scaling and the published
    # checkpoints train on raw units, so normalization is off by default. Switch to
    # MEAN_STD or QUANTILES when training from scratch on a differently scaled dataset.
    normalization_mode: IDENTITY

    # Optimizer / scheduler (AdamW + cosine decay with warmup, matching upstream).
    optimizer_lr: 1.0e-4
    optimizer_weight_decay: 0.0
    optimizer_grad_clip_norm: 10.0
    optimizer_vlm_lr_scale: 0.1
    scheduler_warmup_steps: 1000
    scheduler_decay_steps: 30000
    scheduler_decay_lr: 2.5e-6

data:
  class_path: physicalai.data.lerobot.LeRobotDataModule
  init_args:
    # The dataset must provide `chunk_size` action steps per item; the policy's delta
    # indices configure that automatically.
    repo_id: "lerobot/libero"
    # ~600M trainable parameters: AdamW state alone is ~7 GB, so raise the batch size only
    # once you know it fits, and use `accumulate_grad_batches` for a larger effective batch.
    train_batch_size: 4
    data_format: "physicalai"

trainer:
  max_epochs: 100
  accelerator: gpu
  devices: 1
  precision: bf16-mixed
  log_every_n_steps: 100
  check_val_every_n_epoch: 10
