# SmolVLA Policy Training Configuration
#
# Usage:
#   physicalai fit --config configs/physicalai/smolvla.yaml

model:
  class_path: physicalai.policies.SmolVLA
  init_args:
    # Optional camera remapping for pretrained SmolVLA checkpoints.
    # Example: map dataset camera keys to pretrained camera names.
    # image_key_rename_map:
    #   overview: camera0
    #   gripper: camera1
    image_key_rename_map: {}
    # Optional expected policy camera slots (used for missing-camera padding).
    # image_features: [camera0, camera1, camera2]
    image_features: []
    # Optional number of masked dummy camera slots to append.
    empty_cameras: 0
  # SnapFlow self-distillation (arxiv.org/abs/2604.05656)
  # Uncomment to enable 1-step inference via progressive self-distillation:
  # snapflow_enabled: true
  # snapflow_alpha: 0.5
  # snapflow_lambda: 1.0
  # snapflow_num_inference_steps: 1

data:
  class_path: physicalai.data.lerobot.LeRobotDataModule
  init_args:
    repo_id: "lerobot/pusht"
    train_batch_size: 64
    data_format: "physicalai"
    val_gym:
      class_path: physicalai.gyms.pusht.PushTGym
    image_transforms:
      class_path: torchvision.transforms.v2.Compose
      init_args:
        transforms:
          - class_path: torchvision.transforms.v2.ColorJitter
            init_args:
              contrast:
                - 0.8
                - 1.2
              brightness:
                - 0.7
                - 1.3

trainer:
  max_epochs: 100
  accelerator: gpu
  devices: 1
  precision: 32
  log_every_n_steps: 100
  check_val_every_n_epoch: 10
