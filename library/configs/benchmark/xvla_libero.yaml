# =============================================================================
# XVLA LIBERO-10 Benchmark Evaluation Configuration
# For the published `lerobot/xvla-libero` checkpoint
# =============================================================================
#
# This checkpoint cannot use configs/benchmark/libero.yaml. It predicts an
# ABSOLUTE target end-effector pose per step rather than a delta, so the LIBERO
# controller has to run with control_mode: absolute -- an ablation on tasks 0-4
# scores 0/5 without it. `LiberoBenchmark` does not expose control_mode, so this
# config uses the generic `Benchmark` with explicitly built `LiberoGym` gyms,
# one per task.
#
# -----------------------------------------------------------------------------
# Saving the checkpoint first
# -----------------------------------------------------------------------------
# `--ckpt_path` takes a local export directory or .ckpt, not a Hub repo id, so
# save the published checkpoint once:
#
#   from physicalai.policies.xvla.libero import XVLALiberoPolicy
#
#   policy = XVLALiberoPolicy(pretrained_name_or_path="lerobot/xvla-libero")
#   policy.eval()
#   policy.to_torch("./exports/xvla_libero")
#
# The export's manifest records `XVLALiberoPolicy`, so `InferenceModel` restores
# the LIBERO bridging (20-dim bimanual ee6d <-> LIBERO's 7-dim control vector)
# on load. The saved artifact is self-contained: the architecture config travels
# with it, so reloading does not re-download from the Hub.
#
# -----------------------------------------------------------------------------
# Usage
# -----------------------------------------------------------------------------
#   physicalai benchmark --config configs/benchmark/xvla_libero.yaml \
#       --policy physicalai.inference.InferenceModel \
#       --ckpt_path ./exports/xvla_libero
#
# From a Lightning checkpoint instead, name the bridging subclass -- plain
# `physicalai.policies.XVLA` emits raw 20-dim ee6d actions and will not drive
# LIBERO:
#
#   physicalai benchmark --config configs/benchmark/xvla_libero.yaml \
#       --policy physicalai.policies.xvla.libero.XVLALiberoPolicy \
#       --ckpt_path ./checkpoints/xvla_libero.ckpt
#
# Common overrides:
#   # Quick single-episode smoke test
#   physicalai benchmark --config configs/benchmark/xvla_libero.yaml \
#       --policy physicalai.inference.InferenceModel \
#       --ckpt_path ./exports/xvla_libero \
#       --benchmark.num_episodes 1
#
# -----------------------------------------------------------------------------
# What matters, and what does not
# -----------------------------------------------------------------------------
# Measured on LIBERO-10 tasks 0-4, one episode each, changing one thing at a
# time from this configuration:
#
# | Change                            | Successes |
# |-----------------------------------|-----------|
# | (none)                            | 5/5       |
# | control_mode: relative            | 0/5       |
# | no wrist-camera flip correction   | 2/5       |
# | 256x256 instead of 360x360        | 4/5       |
# | max_steps 520 instead of 800      | 5/5       |
#
# Only control_mode is a setting you can get wrong here; the wrist-camera
# correction is applied by `XVLALiberoPolicy` itself. Render resolution and a
# longer step budget do not matter -- repeating the resolution arm with three
# episodes per task put 360x360 at 13/15 and 256x256 at 12/15, one episode
# apart -- so this config stays on `LiberoGym`'s 256x256 default and LIBERO-10's
# own 520-step limit. Successful episodes finish in roughly 250 steps.
#
# Treat single-episode-per-task figures as a smoke test rather than a success
# rate: flow-matching inference draws fresh noise on every call.
# =============================================================================

benchmark:
  class_path: physicalai.benchmark.gyms.Benchmark
  init_args:
    # -------------------------------------------------------------------------
    # Evaluation Parameters
    # -------------------------------------------------------------------------
    # Number of episodes per task (standard: 20 for paper results)
    num_episodes: 20

    # LIBERO-10's own episode limit; successful episodes finish well inside it
    max_steps: 520

    # Random seed for reproducibility
    seed: 42

    # -------------------------------------------------------------------------
    # Video Recording
    # -------------------------------------------------------------------------
    # Directory for video output (null = no recording)
    video_dir: ./results/benchmark/xvla_libero_10/videos

    # Recording mode: "all" | "failures" | "successes" | "none"
    record_mode: failures

    # -------------------------------------------------------------------------
    # Gyms - one per LIBERO-10 task
    # -------------------------------------------------------------------------
    # control_mode: absolute is required on every entry; see the header.
    gyms:
      - class_path: physicalai.gyms.LiberoGym
        init_args: { task_suite: libero_10, task_id: 0, control_mode: absolute }
      - class_path: physicalai.gyms.LiberoGym
        init_args: { task_suite: libero_10, task_id: 1, control_mode: absolute }
      - class_path: physicalai.gyms.LiberoGym
        init_args: { task_suite: libero_10, task_id: 2, control_mode: absolute }
      - class_path: physicalai.gyms.LiberoGym
        init_args: { task_suite: libero_10, task_id: 3, control_mode: absolute }
      - class_path: physicalai.gyms.LiberoGym
        init_args: { task_suite: libero_10, task_id: 4, control_mode: absolute }
      - class_path: physicalai.gyms.LiberoGym
        init_args: { task_suite: libero_10, task_id: 5, control_mode: absolute }
      - class_path: physicalai.gyms.LiberoGym
        init_args: { task_suite: libero_10, task_id: 6, control_mode: absolute }
      - class_path: physicalai.gyms.LiberoGym
        init_args: { task_suite: libero_10, task_id: 7, control_mode: absolute }
      - class_path: physicalai.gyms.LiberoGym
        init_args: { task_suite: libero_10, task_id: 8, control_mode: absolute }
      - class_path: physicalai.gyms.LiberoGym
        init_args: { task_suite: libero_10, task_id: 9, control_mode: absolute }

# -----------------------------------------------------------------------------
# Output Configuration
# -----------------------------------------------------------------------------
# Directory for benchmark results (JSON, CSV exports)
output_dir: ./results/benchmark/xvla_libero_10
