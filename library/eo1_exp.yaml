# EO-1 Policy Training Configuration — LIBERO fine-tune
#
# Usage:
#   physicalai fit --config eo1_exp.yaml
#
# Fine-tunes the published lerobot/eo1-base checkpoint on the LIBERO imitation dataset. EO-1 pairs
# a Qwen2.5-VL backbone with a continuous flow-matching action head. The Qwen2.5-VL-3B backbone
# dominates the memory footprint; drop the batch size before touching anything else, and turn on
# `gradient_checkpointing` if it still does not fit.

model:
  class_path: physicalai.policies.EO1
  init_args:
    chunk_size: 8
    n_action_steps: 8
    # "auto" follows the backbone config (bf16 for Qwen2.5-VL). The flow head stays fp32 either way.
    dtype: "auto"
    # "sdpa" is the portable choice; use "flash_attention_2" only where flash_attn is installed.
    attn_implementation: "sdpa"
    gradient_checkpointing: false
    # Pixel budget the Qwen image processor resizes each camera to, in units of 28x28 patches.
    # Lower these first when the vision tower dominates the step time.
    image_min_pixels: 50176 # 64 * 28 * 28
    image_max_pixels: 100352 # 128 * 28 * 28
    # State and actions are zero-padded to these widths before the flow head, which is what lets one
    # checkpoint transfer across embodiments. Changing them changes the checkpoint tensor shapes.
    max_state_dim: 32
    max_action_dim: 32
    # LIBERO's native dims (8-dim eef pose + gripper state, 7-dim action); resolved from dataset
    # stats during setup, listed here for reference only.
    action_dim: 7
    state_dim: 8
    num_denoise_steps: 10
    # Fine-tune from the published EO-1 base checkpoint.
    pretrained_name_or_path: lerobot/eo1-base
    # Fine-tuning warrants a lower LR and shorter schedule than pretraining from scratch.
    optimizer_lr: 5.0e-5
    scheduler_warmup_steps: 200
    scheduler_decay_steps: 30000

data:
  class_path: physicalai.data.lerobot.LeRobotDataModule
  init_args:
    # LIBERO imitation dataset (all 5 task suites), published in LeRobot format.
    # https://huggingface.co/datasets/HuggingFaceVLA/libero
    repo_id: "lerobot/libero"
    train_batch_size: 2
    data_format: "physicalai"
    val_gym:
      class_path: physicalai.gyms.libero.LiberoGym
      init_args:
        task_suite: "libero_10"
        task_id: 0

trainer:
  max_epochs: 100
  accelerator: gpu
  devices: 1
  precision: bf16-mixed
  log_every_n_steps: 100
  check_val_every_n_epoch: 10
