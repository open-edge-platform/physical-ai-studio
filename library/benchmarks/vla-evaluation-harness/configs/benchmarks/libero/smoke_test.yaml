# Minimal connectivity and data-mapping check: one task, one episode.
server:
  url: ws://localhost:8000

docker:
  image: ghcr.io/allenai/vla-evaluation-harness/libero:latest

output_dir: ./results

benchmarks:
  - benchmark: vla_eval.benchmarks.libero.benchmark:LIBEROBenchmark
    episodes_per_task: 1
    max_tasks: 1
    params:
      suite: libero_spatial
      seed: 7
      num_steps_wait: 10
