[project]
name = "physicalai-studio-plugin"
version = "0.1.0"
description = "Plugin SDK for Physical AI Studio — types and protocols for building robot catalog plugins"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12",
    "physicalai",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/physicalai_studio_plugin"]

[tool.uv.sources]
physicalai = { git = "https://github.com/openvinotoolkit/physicalai.git", rev = "08fcd96389fa9e326946df6affc5c19c4c731633" }

[dependency-groups]
dev = [
    "ruff~=0.11.2",
    "pyrefly>=0.18.0",
    "types-PyYAML>=6.0.12.20250915",
]
lint = [
    "ruff~=0.11.2",
    "mypy~=1.17",
    "pyrefly>=0.18.0",
    "types-PyYAML>=6.0.12.20250915",
]
all = [
    "ruff~=0.11.2",
    "mypy~=1.17",
    "pyrefly>=0.18.0",
    "types-PyYAML>=6.0.12.20250915",
]

[tool.uv]
default-groups = ["all"]
exclude-newer = "7 days"

[tool.ruff]
extend = "../../pyproject.toml"
preview = false
src = ["src"]

[tool.ruff.lint.per-file-ignores]
"*test*.py" = ["S", "ANN", "D", "ARG", "PLR", "INP001", "SLF001", "TC", "FBT"]
"tests/conftest.py" = ["S", "ANN", "D", "ARG", "PLR", "INP001", "SLF001", "TC", "FBT"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
show_error_codes = true

[tool.pyrefly]
python-version = "3.13"
search-path = ["src"]
project-includes = ["src"]
project-excludes = [".venv/**", "dist/**"]

[tool.pytest.ini_options]
addopts = ["--strict-markers", "--strict-config", "-ra"]
testpaths = "tests"
pythonpath = "src"
