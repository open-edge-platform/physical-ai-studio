[project]
name = "physicalai-lerobot-worker-molmoact2"
version = "0.0.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "lerobot[training,molmoact2]>=0.7,<0.8",
]

[project.optional-dependencies]
cpu = ["torch", "torchvision"]
cu132 = ["torch", "torchvision"]
xpu = ["torch", "torchvision"]

[tool.uv]
package = false
index-strategy = "unsafe-best-match"
conflicts = [
    [{ extra = "cpu" }, { extra = "cu132" }],
    [{ extra = "cpu" }, { extra = "xpu" }],
    [{ extra = "cu132" }, { extra = "xpu" }],
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = false

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu132", extra = "cu132" },
    { index = "pytorch-xpu", extra = "xpu" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu132", extra = "cu132" },
    { index = "pytorch-xpu", extra = "xpu" },
]
triton-xpu = { index = "pytorch-xpu" }
