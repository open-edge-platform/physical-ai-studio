[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "physicalai-lerobot-policy-plugin"
version = "0.1.0"
description = "Native LeRobot training and Runtime policy integration for Physical AI"
readme = "README.md"
requires-python = ">=3.12, <3.15"
license = "Apache-2.0"
dependencies = [
    "physicalai>=0.4.1.dev0,<0.5",
    "lerobot[dataset]>=0.7,<0.8",
    # LeRobot's Diffusion policy imports Diffusers at inference time; floor for CVE-2026-44827.
    # No upper bound here: the training worker gets LeRobot's own range in its locked project.
    "diffusers>=0.38.0",
]

[project.optional-dependencies]
train = [
    "physicalai-train>=0.3.0",
    "lerobot[training]",
]
tests = ["pytest>=9.0.3"]

[project.entry-points."physicalai.engines"]
lerobot = "physicalai_lerobot_policy_plugin.engine:LeRobotEngine"

[project.entry-points."physicalai.inference.adapters"]
lerobot = "physicalai_lerobot_policy_plugin.inference:register"

[tool.hatch.build.targets.wheel]
packages = ["src/physicalai_lerobot_policy_plugin"]

[tool.hatch.build.targets.wheel.force-include]
"src/physicalai_lerobot_policy_plugin/env/pyproject.toml" = "physicalai_lerobot_policy_plugin/env/pyproject.toml"
"src/physicalai_lerobot_policy_plugin/env/uv.lock" = "physicalai_lerobot_policy_plugin/env/uv.lock"

[tool.hatch.build.targets.sdist]
include = [
    "/README.md",
    "/pyproject.toml",
    "/src/physicalai_lerobot_policy_plugin/**",
]

[tool.hatch.build.targets.sdist.force-include]
"src/physicalai_lerobot_policy_plugin/env/pyproject.toml" = "src/physicalai_lerobot_policy_plugin/env/pyproject.toml"
"src/physicalai_lerobot_policy_plugin/env/uv.lock" = "src/physicalai_lerobot_policy_plugin/env/uv.lock"

[tool.uv.sources]
physicalai = { git = "https://github.com/openvinotoolkit/physicalai.git", rev = "c2535de38a38950f4ad0f4b73178ba53429efa16" }
# Keep the optional train extra on this checkout's Runtime source.
physicalai-train = { path = "../../../library", editable = true }

[tool.ruff]
extend = "../../../pyproject.toml"
src = ["src", "tests"]
extend-exclude = ["tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D103", "S101"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
show_error_codes = true
explicit_package_bases = true
